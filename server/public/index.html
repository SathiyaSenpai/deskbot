<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nisya AI companion robot control interface">
  <title>Nisya - Control Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Status Bar -->
  <header class="status-bar">
    <div class="robot-name" id="robotName">🤖 Nisya Companion</div>
    <div class="connection" id="connectionStatus" data-status="disconnected">
      <span class="status-indicator">●</span>
      <span class="status-text">Disconnected</span>
    </div>
    <div class="robot-state" id="robotState" data-state="IDLE">IDLE</div>
  </header>

  <!-- Main Content Area -->
  <main class="main-container">
    
    <!-- Left: Robot Panel -->
    <section class="robot-panel" aria-label="Robot Status">
      <!-- Eye Animation Preview (OLED Simulator) -->
      <div class="robot-display">
        <div class="oled-preview" id="oledPreview">
          <div class="eye" id="eyeLeft"></div>
          <div class="eye" id="eyeRight"></div>
        </div>
        <div class="robot-name-label">NISYA</div>
        <div class="behavior-label" id="currentBehavior">calm_idle</div>
      </div>
      
      <!-- LED Color Control -->
      <div class="led-control">
        <h4>Mood Light</h4>
        <div class="led-presets">
          <button class="led-btn" data-color="#ff0000" style="background:#ff0000" title="Red"></button>
          <button class="led-btn" data-color="#00ff00" style="background:#00ff00" title="Green"></button>
          <button class="led-btn" data-color="#0000ff" style="background:#0000ff" title="Blue"></button>
          <button class="led-btn" data-color="#ffff00" style="background:#ffff00" title="Yellow"></button>
          <button class="led-btn" data-color="#ff00ff" style="background:#ff00ff" title="Purple"></button>
          <button class="led-btn" data-color="#00ffff" style="background:#00ffff" title="Cyan"></button>
          <button class="led-btn" data-color="#ffffff" style="background:#ffffff" title="White"></button>
          <button class="led-btn led-off" data-color="off" title="Off">✕</button>
        </div>
      </div>
      
      <!-- Sensor Status -->
      <div class="robot-info">
        <h4>Sensors</h4>
        <div class="info-item">
          <span class="info-label">💡 Light</span>
          <span class="info-value" id="sensorLight">—</span>
        </div>
        <div class="info-item">
          <span class="info-label">👋 Motion</span>
          <span class="info-value" id="sensorMotion">—</span>
        </div>
        <div class="info-item">
          <span class="info-label">📏 Distance</span>
          <span class="info-value" id="sensorDistance">—</span>
        </div>
        <div class="info-item">
          <span class="info-label">✋ Touch (Head/Side)</span>
          <span class="info-value" id="sensorTouch">—</span>
        </div>
        <div class="info-item">
          <span class="info-label">🌡️ Temp (DS3231)</span>
          <span class="info-value" id="sensorTemp">—</span>
        </div>
      </div>
      
      <!-- Demo Controls -->
      <div class="demo-panel">
        <h4>🎬 Demo Controls</h4>
        
        <!-- Stopwatch -->
        <div class="demo-section">
          <label>⏱️ Stopwatch</label>
          <div class="stopwatch-display" id="stopwatchDisplay">00:00.00</div>
          <div class="btn-row">
            <button class="demo-btn" onclick="stopwatchStart()">▶️ Start</button>
            <button class="demo-btn" onclick="stopwatchStop()">⏸️ Stop</button>
            <button class="demo-btn" onclick="stopwatchReset()">🔄 Reset</button>
          </div>
        </div>

        <!-- RTC Alarm -->
        <div class="demo-section">
          <label>⏰ DS3231 Alarm</label>
          <div class="btn-row" style="margin-bottom: 8px;">
            <input type="time" id="alarmTimeInput" class="alarm-input" value="12:00" style="padding: 6px; border-radius: 4px; border: 1px solid #ddd; font-family: monospace;">
            <button class="demo-btn" onclick="setAlarm()">🔔 Set Alarm</button>
          </div>
          <div class="btn-row">
            <button class="demo-btn" onclick="dismissAlarm()">🔕 Dismiss / Silence</button>
            <button class="demo-btn" onclick="syncTimeNow()">🔄 Sync Time</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Right: Chat Panel -->
    <section class="chat-panel" aria-label="Conversation">
      <div class="chat-header">
        <h2>💬 Chat with Nisya</h2>
        <div class="chat-actions">
          <select id="languageSelect" class="lang-select" title="Voice & Language">
            <option value="en">🇺🇸 English (Kokoro)</option>
            <option value="ta">🇮🇳 Tamil / தமிழ் (Piper)</option>
            <option value="hi">🇮🇳 Hindi / हिंदी (Kokoro)</option>
          </select>
          <button id="servoLeft" class="servo-btn" title="Look Left">⬅️</button>
          <button id="servoCenter" class="servo-btn" title="Center">⏺️</button>
          <button id="servoRight" class="servo-btn" title="Look Right">➡️</button>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages">
        <!-- Messages will be added dynamically by JavaScript -->
        <div class="message robot">
          <div class="message-content">வணக்கம்! I'm Nisya, your caring companion 😊</div>
          <div class="message-time">Just now</div>
        </div>
        <!-- Mic waveform indicator — shown only when hardware mic detects voice -->
        <div id="micWaveform">
          <div class="waveform-bar"></div>
          <div class="waveform-bar"></div>
          <div class="waveform-bar"></div>
          <div class="waveform-bar"></div>
          <div class="waveform-bar"></div>
          <div class="waveform-bar"></div>
          <div class="waveform-bar"></div>
          <span class="waveform-label">Listening…</span>
        </div>
      </div>
    </section>

  </main>

  <!-- Bottom Input Bar -->
  <footer class="input-bar">
    <button id="micButton" class="mic-button" title="Hold to speak (mobile only)">
      <span class="mic-icon">🎤</span>
      <span class="mic-status"></span>
    </button>
    <input 
      type="text" 
      id="messageInput" 
      class="message-input"
      placeholder="Say something to your companion..." 
      disabled
      autocomplete="off"
      maxlength="500"
    >
    <button id="sendButton" class="send-button" disabled>
      <span>Send</span>
    </button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
